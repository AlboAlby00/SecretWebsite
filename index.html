<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 9/11 Zeynep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #8ed3f4;
    font-family: "Fredoka", "Comic Sans MS", "Trebuchet MS", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  canvas {
    position: fixed;
    inset: 0;
    display: block;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    text-align: center;
    padding: 1rem;
    pointer-events: none;
  }
  .line {
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.9s ease, transform 0.9s ease;
    color: #ffffff;
    text-shadow: 0 3px 0 rgba(0,0,0,0.18), 0 0 24px rgba(0,0,0,0.35);
  }
  .line.show {
    opacity: 1;
    transform: translateY(0);
  }
  #line1 {
    font-size: clamp(2.6rem, 9vw, 5.5rem);
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  #line2 {
    font-size: clamp(1.2rem, 4.5vw, 2.6rem);
    font-weight: 600;
  }

  #reveal {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.2s ease;
  }
  #reveal.show {
    opacity: 1;
  }
  #reveal .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #reveal .card {
    position: relative;
    background: rgba(255, 255, 255, 0.92);
    color: #2c3e50;
    border-radius: 18px;
    padding: 1.7rem 2.2rem;
    max-width: 38ch;
    text-align: center;
    font-size: clamp(1.1rem, 3.6vw, 2rem);
    font-weight: 600;
    box-shadow: 0 12px 44px rgba(0,0,0,0.28);
    transform: translateY(14px);
    transition: transform 0.9s ease 0.35s;
  }
  #reveal.show .card {
    transform: translateY(0);
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="overlay">
  <div class="line" id="line1">happy 9/11 Zeynep</div>
  <div class="line" id="line2">(and happy birthday too)</div>
</div>
<div id="reveal">
  <svg class="bg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7ec8f0"/>
        <stop offset="1" stop-color="#d6f0fc"/>
      </linearGradient>
    </defs>
    <rect width="1600" height="900" fill="url(#sky)"/>
    <circle cx="1330" cy="180" r="60" fill="#ffe066"/>
    <g fill="#ffffff" opacity="0.9">
      <ellipse cx="300" cy="180" rx="95" ry="42"/>
      <ellipse cx="390" cy="205" rx="70" ry="32"/>
      <ellipse cx="880" cy="150" rx="85" ry="36"/>
      <ellipse cx="960" cy="180" rx="55" ry="26"/>
    </g>
    <polygon points="0,900 360,240 780,900" fill="#a9c2d8"/>
    <polygon points="320,330 360,240 400,330 360,360" fill="#ffffff"/>
    <polygon points="860,900 1300,280 1740,900" fill="#b8c6d0"/>
    <polygon points="1260,370 1300,280 1340,370 1300,400" fill="#ffffff"/>
    <ellipse cx="250" cy="940" rx="780" ry="170" fill="#7fb069"/>
    <ellipse cx="1450" cy="960" rx="900" ry="200" fill="#6ba25a"/>
    <g stroke="#4a5560" stroke-width="6" stroke-linecap="round">
      <line x1="150" y1="540" x2="900" y2="700"/>
    </g>
    <line x1="600" y1="635" x2="600" y2="685" stroke="#4a5560" stroke-width="4"/>
    <circle cx="600" cy="625" r="16" fill="#e74c3c"/>
    <rect x="895" y="640" width="12" height="60" fill="#7f8c98"/>
  </svg>
  <div class="card">Your gift: AlpspitzKICK &mdash; the longest zipline in Germany, Nesselwang</div>
</div>
<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

let W = window.innerWidth;
let H = window.innerHeight;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

const T_IMPACT = 9000;
const T_EXPLODE_END = 11800;

const GROUND = 0.82;
const TOWER_X1 = 0.66;
const TOWER_W = 0.06;
const GAP = 0.02;
const TOWER_H1 = 0.58;
const TOWER_H2 = 0.55;

const IMPACT_X = TOWER_X1 + TOWER_W / 2;
const IMPACT_Y = 0.40;

const PLANE_START_X = -0.18;
const PLANE_START_Y = 0.33;

const buildings = [
  { x: 0.000, w: 0.10, h: 0.16, c: '#b6c2cc' },
  { x: 0.088, w: 0.07, h: 0.23, c: '#aab7c2' },
  { x: 0.158, w: 0.09, h: 0.12, c: '#b6c2cc' },
  { x: 0.244, w: 0.07, h: 0.18, c: '#aab7c2' },
  { x: 0.312, w: 0.08, h: 0.14, c: '#b6c2cc' },
  { x: 0.392, w: 0.07, h: 0.21, c: '#aab7c2' },
  { x: 0.460, w: 0.08, h: 0.13, c: '#b6c2cc' },
  { x: 0.540, w: 0.07, h: 0.17, c: '#aab7c2' },
  { x: 0.850, w: 0.15, h: 0.11, c: '#b6c2cc' },
];

const clouds = [
  { x: 0.15, y: 0.14, s: 1.0 },
  { x: 0.45, y: 0.08, s: 0.7 },
  { x: 0.78, y: 0.18, s: 0.9 },
  { x: 0.30, y: 0.26, s: 0.6 },
  { x: 0.60, y: 0.30, s: 0.55 },
];

let debris = null;

function makeDebris(dim) {
  debris = [];
  const colors = ['#ff7a00', '#ffb200', '#e74c3c', '#7f8c98', '#cdd9e0'];
  const n = 28;
  for (let i = 0; i < n; i++) {
    debris.push({
      a: Math.random() * Math.PI * 2,
      sp: dim * (0.10 + Math.random() * 0.24),
      size: dim * (0.006 + Math.random() * 0.02),
      color: colors[i % colors.length],
    });
  }
}

function drawSky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#7ec8f0');
  g.addColorStop(1, '#cdeefc');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawSun() {
  ctx.save();
  const x = W * 0.12;
  const y = H * 0.14;
  ctx.fillStyle = '#ffe066';
  ctx.beginPath();
  ctx.arc(x, y, Math.min(W, H) * 0.06, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff3b0';
  ctx.beginPath();
  ctx.arc(x, y, Math.min(W, H) * 0.045, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawCloud(cx, cy, s) {
  ctx.save();
  ctx.fillStyle = '#ffffff';
  ctx.globalAlpha = 0.9;
  const r = Math.min(W, H) * 0.035 * s;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.arc(cx + r, cy - r * 0.4, r * 0.8, 0, Math.PI * 2);
  ctx.arc(cx + r * 1.7, cy, r * 0.75, 0, Math.PI * 2);
  ctx.arc(cx + r * 0.8, cy + r * 0.3, r * 0.7, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawBuilding(x, w, h, color) {
  const bx = x * W;
  const bw = w * W;
  const bh = h * H;
  const by = GROUND * H - bh;
  ctx.fillStyle = color;
  ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = 'rgba(70, 90, 110, 0.35)';
  const cols = Math.max(1, Math.floor(bw / (W * 0.018)));
  const rows = Math.max(1, Math.floor(bh / (W * 0.024)));
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const wx = bx + bw * (c + 0.5) / cols;
      const wy = by + bh * (r + 0.55) / rows;
      ctx.fillRect(wx, wy, Math.max(1, W * 0.0035), Math.max(1, W * 0.006));
    }
  }
}

function drawTower(x, w, h, withAntenna) {
  const bx = x * W;
  const bw = w * W;
  const bh = h * H;
  const by = GROUND * H - bh;

  ctx.fillStyle = '#cdd8e0';
  ctx.fillRect(bx, by, bw, bh);

  const cols = 16;
  const colW = bw / cols;
  ctx.fillStyle = '#b8c6d0';
  for (let i = 0; i < cols; i++) {
    if (i % 2 === 0) {
      ctx.fillRect(bx + i * colW, by, colW * 0.55, bh);
    }
  }
  ctx.fillStyle = 'rgba(58, 78, 94, 0.5)';
  for (let i = 1; i < cols; i++) {
    ctx.fillRect(bx + i * colW - colW * 0.16, by, colW * 0.16, bh);
  }

  ctx.strokeStyle = 'rgba(70, 90, 110, 0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw, bh);

  if (withAntenna) {
    ctx.fillStyle = '#e8eef2';
    ctx.fillRect(bx + bw * 0.46, by - H * 0.045, bw * 0.08, H * 0.045);
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(bx + bw * 0.5, by - H * 0.045, bw * 0.035, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPlane(x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);

  ctx.fillStyle = '#b9c6d0';
  ctx.beginPath();
  ctx.moveTo(-0.08, -0.02);
  ctx.lineTo(-0.28, -0.5);
  ctx.lineTo(0.06, -0.5);
  ctx.lineTo(0.14, -0.02);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-0.08, 0.02);
  ctx.lineTo(-0.28, 0.5);
  ctx.lineTo(0.06, 0.5);
  ctx.lineTo(0.14, 0.02);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  ctx.moveTo(-0.42, -0.04);
  ctx.lineTo(-0.5, -0.38);
  ctx.lineTo(-0.32, -0.04);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#b9c6d0';
  ctx.beginPath();
  ctx.moveTo(-0.4, 0.0);
  ctx.lineTo(-0.52, 0.16);
  ctx.lineTo(-0.3, 0.16);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#f4f6f8';
  ctx.strokeStyle = 'rgba(90, 110, 130, 0.5)';
  ctx.lineWidth = 0.02;
  ctx.beginPath();
  ctx.ellipse(0, 0, 0.5, 0.15, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#c9d4dd';
  ctx.beginPath();
  ctx.ellipse(0.46, 0, 0.08, 0.11, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#5b7280';
  for (let i = -0.32; i <= 0.3; i += 0.1) {
    ctx.beginPath();
    ctx.arc(i, -0.02, 0.032, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function easeOut(t) {
  return 1 - Math.pow(1 - t, 2);
}

function clamp(t) {
  return Math.min(1, Math.max(0, t));
}

function drawExplosion(t, ex, ey) {
  const e = clamp((t - T_IMPACT) / (T_EXPLODE_END - T_IMPACT));
  const dim = Math.min(W, H);

  if (!debris) makeDebris(dim);

  if (e < 0.14) {
    ctx.fillStyle = 'rgba(255,255,255,' + (1 - e / 0.14) * 0.9 + ')';
    ctx.fillRect(0, 0, W, H);
  }

  const R = dim * 0.28;
  const grow = e < 0.45 ? easeOut(e / 0.45) : 1;
  const fade = e < 0.45 ? 1 : 1 - (e - 0.45) / 0.55;
  const r = R * (e < 0.45 ? grow : 1 - 0.3 * ((e - 0.45) / 0.55));

  ctx.save();
  ctx.globalAlpha = fade;

  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  ctx.arc(ex, ey, r, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ff7a00';
  ctx.beginPath();
  ctx.arc(ex, ey - r * 0.15, r * 0.8, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ffb200';
  ctx.beginPath();
  ctx.arc(ex, ey - r * 0.1, r * 0.55, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ffe066';
  ctx.beginPath();
  ctx.arc(ex, ey - r * 0.08, r * 0.32, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ff7a00';
  ctx.beginPath();
  ctx.ellipse(ex, ey - r * 0.7, r * 0.45, r * 0.75, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  ctx.save();
  ctx.globalAlpha = clamp((e - 0.3) / 0.6);
  ctx.fillStyle = '#7f8c98';
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const dist = e * dim * (0.05 + (i % 4) * 0.03);
    const sy = ey - e * dim * 0.16 - (i % 2) * dim * 0.03;
    const sr = dim * (0.05 + (i % 4) * 0.02);
    ctx.beginPath();
    ctx.arc(ex + Math.cos(a) * dist * 0.6, sy, sr, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = clamp(1 - e * 1.2);
  for (const d of debris) {
    const px = ex + Math.cos(d.a) * d.sp * e;
    const py = ey + Math.sin(d.a) * d.sp * e + dim * 0.15 * e * e;
    ctx.fillStyle = d.color;
    ctx.beginPath();
    ctx.arc(px, py, d.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawScene(t) {
  drawSky(t);

  drawSun();

  for (let i = 0; i < clouds.length; i++) {
    const c = clouds[i];
    const cx = ((c.x + (t * 0.000004 * (1 + i % 2))) % 1.2 - 0.1) * W;
    drawCloud(cx, c.y * H, c.s);
  }

  for (const b of buildings) {
    drawBuilding(b.x, b.w, b.h, b.c);
  }

  drawTower(TOWER_X1 + GAP, TOWER_W, TOWER_H2, false);
  drawTower(TOWER_X1, TOWER_W, TOWER_H1, true);

  if (t < T_IMPACT) {
    const p = Math.min(1, t / T_IMPACT);
    const px = lerp(PLANE_START_X, IMPACT_X, p);
    const py = lerp(PLANE_START_Y, IMPACT_Y, p);
    const s = Math.min(W, H) * 0.16;
    drawPlane(px * W, py * H, s);
  } else {
    const ex = IMPACT_X * W;
    const ey = IMPACT_Y * H;
    const e = clamp((t - T_IMPACT) / (T_EXPLODE_END - T_IMPACT));
    const shake = (1 - e) * 12;
    ctx.save();
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawExplosion(t, ex, ey);
    ctx.restore();
  }
}

function loop() {
  const t = performance.now();
  drawScene(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

setTimeout(() => document.getElementById('line1').classList.add('show'), 11800);
setTimeout(() => document.getElementById('line2').classList.add('show'), 13000);
setTimeout(() => document.getElementById('reveal').classList.add('show'), 14500);
</script>
</body>
</html>
